# docker-compose.prod.yml — the PAID-BLOCK overlay (Day 6, ADR-008)
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file stays the DEV chart (hot mounts + dev runtime). This overlay
# inverts the three dev-only facts, per service:
#   1. no host-source mounts   -> source + deps come from the BAKED image (Gate ①)
#   2. prod run command        -> kill dev-time behavior (watch / reload)
#   3. restart: unless-stopped -> the restaurant re-opens itself after a crash
#
# The entire dev-vs-prod difference lives HERE. Zero source-code divergence.

services:
  postgres:
    ports: !reset []   # 2026-09-11 (ADR-008 consequence): the cellar has NO host door in prod.
    # ADR-009 fix — use the compose-spec `!reset` tag, not `[]` / `~`:
    #   • `ports: []` and `ports: ~` are BOTH NO-OPS. Compose MERGES overlay lists
    #     by APPENDING (unique-key dedupe), so an empty overlay list appends nothing
    #     and the base `ports` entry ships unchanged. Verified on compose 5.3.
    #   • `ports: !reset []` CLEARS the base list entirely — the documented, robust
    #     "remove a base declaration" mechanism. So a prod `up` is doorless EVEN IF
    #     a dev later re-adds a host port to the base file.
    # (The prior comment over-claimed that this `[]` line "guards" doorless prod; it
    #  only ever held because the base *happened* to have no entry. `!reset` is real.)
    #
    # Why no door at all instead of a 127.0.0.1 one: 5432 is the universe's
    # default Postgres port. A host mapping — even 127.0.0.1-pinned — still
    # BINDS 5432, and `up` dies if anything else on the box owns it (a native
    # Postgres, a coworker's laptop, a stray container, or yesterday's own
    # half-attached ghost). 5433/5434 fiddling on 2026-09-03 was this bug in
    # disguise; the 127.0.0.1 revert of 2026-09-11 only narrowed the blast
    # radius, not the bug. The app containers never used the door —
    # DATABASE_URL = postgres:5432, service-name over the internal net — so
    # removing it costs nothing that ever ran. Manual inspection of prod data
    # is now deliberate: `docker compose exec postgres psql -U postgres` or an
    # SSH tunnel.

  taskflow-ts:
    volumes: !reset []   # DROP base's ./ts + :cached node_modules mounts: the baked image IS the tree.
    # dev's `pnpm dev` = tsx WATCH. prod runs tsx ONCE: file-watching is a dev-only
    # behavior; a code change in prod means a NEW IMAGE, and Docker's restart policy
    # (below) handles crash-recovery — not a watcher.
    command: pnpm tsx src/main.ts
    restart: unless-stopped

  taskflow-py:
    volumes: !reset []   # DROP base's ./py mount (+ __pycache__ guard): the baked image IS the tree.
    # overrides src/main.py's hard reload=True WITHOUT editing main.py: uvicorn
    # re-imports module `src.main` -> initDb() runs -> startServer(8001) -> the
    # hard 8001 listen in main.ts; the reload flag lives in the run command, so
    # dev and prod share one file.
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
