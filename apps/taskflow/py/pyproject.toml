[project]
name = "taskflow-py"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.19.1",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"