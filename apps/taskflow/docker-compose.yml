services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports: []  # 2026-09-11, ADR-008: the cellar's host door is OFF by default (was a
      # hardcoded - "127.0.0.1:5432:5432" that crashed `up` if anything else on the
      # host owned 5432 — native Postgres, another container… — and dragged the whole
      # stack down on the 2026-09-11 box, exactly as ADR-008 predicted).
      #
      # CRITICAL: must be an EMPTY LIST, not `ports:` (null). A bare `ports:` key with
      # only comments underneath is parsed as NULL, and compose validates the BASE file
      # in isolation, rejecting it with `services.postgres.ports must be a array` —
      # which makes EVERY `up` fail, dev AND prod, before the overlay is even applied.
      # `ports: []` is the valid "deliberately empty" form.
      #
      # The app containers reach the cellar by service name (`postgres`) over the compose
      # network, NOT a host mapping; it only ever existed for a manual `psql localhost:5432`.
      #
      # Devs who want the cellar's tap on the host: add  `- "127.0.0.1:5432:5432"` under
      # `ports:` for local dev ONLY. A prod `up` uses `-f ... -f docker-compose.prod.yml`,
      # and its `ports: !reset []` (ADR-009) keeps prod doorless no matter what you uncomment.
    volumes:
      # - postgres_data:/var/lib/postgresql/taskflow-app-data # did not work
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  taskflow-ts:
    build: ./ts
    ports:
      - "8000:8000"
    environment: 
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskflow
      CI: "true" # Fix: Tells pnpm to bypass the interactive TTY confirmation prompt
      AUTH0_DOMAIN: dev-qr8x8ecg3nfb603i.uk.auth0.com
      AUTH0_AUDIENCE: https://dev-qr8x8ecg3nfb603i.uk.auth0.com/api/v2/
    volumes: 
      - ./ts:/app
      - ./ts/node_modules:/app/node_modules:cached
    command: pnpm dev
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    healthcheck:
      # Uses wget (built into Alpine) to probe the endpoint
      # test: [ "CMD-SHELL", "wget" , "--no-verbose", "--tries=1", "--timeout=5", "--spider", "http://localhost:8000/workspaces"]
      # test: ["CMD-SHELL","wget -q --spider -T 5 http://localhost:8000/workspaces || exit 1"]

      # -f forces curl to return an error code if the server responds with a 4xx or 5xx error
      # -s silences progress meters so logs stay completely clean
      # test: ["CMD-SHELL", "curl -f -s http://localhost:8000/workspaces || exit 1"]

      test: ["CMD-SHELL","wget -q --spider -T 5 http://127.0.0.1:8000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s # Gives the app time to boot before failing checks
  taskflow-py:
    build: ./py
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/taskflow
      AUTH0_DOMAIN: dev-qr8x8ecg3nfb603i.uk.auth0.com
      AUTH0_AUDIENCE: https://dev-qr8x8ecg3nfb603i.uk.auth0.com/api/v2/
    volumes:
      # Mounts local Python working directory into the container
      - ./py:/app
      # Anonymous volume trick protects container's internal pycache from host overwrites
      - /app/__pycache__
    command: uv run python -m src.main
    depends_on:
      postgres:
        condition: service_healthy
      db-push: # to serialize behind the schema owner
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  db-push:
    build: ./ts
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/taskflow
    command: pnpm db:push
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: # to hook that local x storage space inside your PostgreSQL container (/var/lib/postgresql/data)